name: Deploy to AWS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2 

      - name: Copy Files
        uses: appleboy/scp-action@master
        with:
          host: ${{secrets.EC2_HOST}}
          username: ${{secrets.EC2_USER}}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          port: 22
          source: "./"
          target: "/home/ubuntu/bricks-agent-adminpanel"
      
      - name: Install Packages & Reload PM2
        env:
          PRIVATE_KEY: ${{ secrets.EC2_PRIVATE_KEY }}
          HOSTNAME : ${{ secrets.EC2_HOST }}
          USER_NAME : ${{ secrets.EC2_USER }}
           
        run: |
          echo "$PRIVATE_KEY" > private_key && chmod 600 private_key
          ssh -o StrictHostKeyChecking=no -i private_key ${USER_NAME}@${HOSTNAME} "cd /home/ubuntu/bricks-agent-adminpanel && npm install && npx pm2 restart project1"
          
