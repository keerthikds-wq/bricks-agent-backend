<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdf6e9"/>
      <stop offset="1" stop-color="#f0e0c0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <ellipse cx="256" cy="455" rx="180" ry="14" fill="#000" opacity="0.15"/>
  <!-- Aluminum sliding window -->
  <g transform="translate(60,140)">
    <rect x="-10" y="-10" width="412" height="252" fill="#475569" stroke="#1e293b" stroke-width="3"/>
    <rect x="0" y="0" width="392" height="232" fill="#cbd5e1" stroke="#1e293b" stroke-width="2"/>
    <!-- Left pane glass -->
    <rect x="10" y="10" width="180" height="212" fill="#bae6fd" stroke="#1e293b" stroke-width="2" opacity="0.7"/>
    <!-- Right pane glass -->
    <rect x="200" y="10" width="180" height="212" fill="#7dd3fc" stroke="#1e293b" stroke-width="2" opacity="0.7"/>
    <!-- Glass shine -->
    <polygon points="20,20 80,20 50,210 10,210" fill="#fff" opacity="0.3"/>
    <polygon points="210,20 250,20 230,210 200,210" fill="#fff" opacity="0.3"/>
    <!-- Middle rail -->
    <rect x="190" y="0" width="12" height="232" fill="#64748b" stroke="#1e293b" stroke-width="2"/>
    <!-- Handle -->
    <rect x="180" y="110" width="32" height="14" rx="2" fill="#1e293b"/>
    <!-- View through window -->
    <g opacity="0.4">
      <circle cx="80" cy="70" r="18" fill="#fbbf24"/>
      <path d="M30 180 L80 130 L130 180 L180 130 L180 220 L10 220 Z" fill="#16a34a"/>
      <path d="M220 180 L270 140 L320 180 L370 140 L370 220 L200 220 Z" fill="#16a34a"/>
    </g>
  </g>
  <rect x="170" y="60" width="172" height="35" rx="5" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
  <text x="256" y="83" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1e3a8a" text-anchor="middle">ALUMINUM WINDOW</text>
</svg>
