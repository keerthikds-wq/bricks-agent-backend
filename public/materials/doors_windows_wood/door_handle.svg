<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdf6e9"/>
      <stop offset="1" stop-color="#f0e0c0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <ellipse cx="256" cy="455" rx="180" ry="14" fill="#000" opacity="0.15"/>
  <!-- Door handle / lock -->
  <g transform="translate(180,140)">
    <!-- Back plate -->
    <rect x="0" y="0" width="152" height="232" rx="6" fill="#fafafa" stroke="#0f172a" stroke-width="3"/>
    <!-- Handle plate -->
    <ellipse cx="76" cy="116" rx="40" ry="50" fill="#facc15" stroke="#713f12" stroke-width="3"/>
    <!-- Lever handle -->
    <rect x="100" y="106" width="80" height="20" rx="10" fill="#facc15" stroke="#713f12" stroke-width="3"/>
    <ellipse cx="180" cy="116" rx="10" ry="14" fill="#eab308" stroke="#713f12" stroke-width="2"/>
    <!-- Keyhole -->
    <circle cx="76" cy="180" r="10" fill="#1c1917" stroke="#713f12" stroke-width="2"/>
    <rect x="73" y="178" width="6" height="14" fill="#1c1917"/>
    <!-- Highlight -->
    <ellipse cx="66" cy="100" rx="10" ry="20" fill="#fef3c7" opacity="0.7"/>
    <ellipse cx="120" cy="113" rx="10" ry="5" fill="#fef3c7" opacity="0.7"/>
    <!-- Screws -->
    <circle cx="15" cy="15" r="4" fill="#475569"/>
    <circle cx="137" cy="15" r="4" fill="#475569"/>
    <circle cx="15" cy="217" r="4" fill="#475569"/>
    <circle cx="137" cy="217" r="4" fill="#475569"/>
  </g>
  <rect x="170" y="50" width="172" height="35" rx="5" fill="#fef3c7" stroke="#78350f" stroke-width="2"/>
  <text x="256" y="73" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#78350f" text-anchor="middle">DOOR HANDLE + LOCK</text>
</svg>
