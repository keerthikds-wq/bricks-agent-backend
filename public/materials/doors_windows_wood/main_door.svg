<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdf6e9"/>
      <stop offset="1" stop-color="#f0e0c0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <ellipse cx="256" cy="455" rx="180" ry="14" fill="#000" opacity="0.15"/>
  <!-- Premium teak door -->
  <g transform="translate(146,80)">
    <rect x="-15" y="-15" width="250" height="380" rx="3" fill="#1c1917" stroke="#0c0a09" stroke-width="3"/>
    <rect x="0" y="0" width="220" height="350" fill="#78350f" stroke="#451a03" stroke-width="2"/>
    <g stroke="#451a03" stroke-width="1.2" fill="none" opacity="0.7">
      <path d="M10 25 Q60 50 110 25 Q160 0 210 30"/>
      <path d="M10 75 Q60 100 110 75 Q160 50 210 80"/>
      <path d="M10 125 Q60 150 110 125 Q160 100 210 130"/>
      <path d="M10 175 Q60 200 110 175 Q160 150 210 180"/>
      <path d="M10 225 Q60 250 110 225 Q160 200 210 230"/>
      <path d="M10 275 Q60 300 110 275 Q160 250 210 280"/>
      <path d="M10 325 Q60 345 110 325 Q160 305 210 330"/>
    </g>
    <!-- Carved panels with geometric pattern -->
    <rect x="30" y="30" width="160" height="80" rx="2" fill="#92400e" stroke="#451a03" stroke-width="2"/>
    <g stroke="#451a03" stroke-width="1.5" fill="none">
      <polygon points="60,50 110,40 160,50 160,90 110,100 60,90" />
      <polygon points="70,55 110,48 150,55 150,85 110,92 70,85" />
    </g>
    <rect x="30" y="130" width="160" height="190" rx="2" fill="#92400e" stroke="#451a03" stroke-width="2"/>
    <g stroke="#451a03" stroke-width="1.5" fill="none">
      <rect x="50" y="150" width="120" height="150"/>
      <rect x="60" y="160" width="100" height="130"/>
      <line x1="50" y1="225" x2="170" y2="225"/>
      <line x1="110" y1="150" x2="110" y2="300"/>
    </g>
    <!-- Brass handle vertical -->
    <rect x="180" y="170" width="10" height="80" rx="2" fill="#facc15" stroke="#713f12" stroke-width="2"/>
    <!-- Hinges -->
    <rect x="0" y="40" width="10" height="35" fill="#52525b"/>
    <rect x="0" y="170" width="10" height="35" fill="#52525b"/>
    <rect x="0" y="295" width="10" height="35" fill="#52525b"/>
  </g>
  <rect x="180" y="40" width="152" height="35" rx="5" fill="#fef3c7" stroke="#78350f" stroke-width="2"/>
  <text x="256" y="63" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#78350f" text-anchor="middle">MAIN TEAK DOOR</text>
</svg>
