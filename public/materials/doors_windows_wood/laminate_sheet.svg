<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdf6e9"/>
      <stop offset="1" stop-color="#f0e0c0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <ellipse cx="256" cy="455" rx="180" ry="14" fill="#000" opacity="0.15"/>
  <!-- Laminate sheet curving -->
  <g transform="translate(60,140)">
    <path d="M0 60 L380 0 L392 220 Q200 230 0 220 Z" fill="#7c2d12" stroke="#1c0701" stroke-width="3"/>
    <!-- Wood grain pattern -->
    <g stroke="#451a03" stroke-width="1" fill="none" opacity="0.6">
      <path d="M20 80 Q180 60 380 30"/>
      <path d="M20 120 Q180 100 380 70"/>
      <path d="M20 160 Q180 140 380 110"/>
      <path d="M20 200 Q180 180 380 150"/>
    </g>
    <g fill="#92400e" opacity="0.5">
      <ellipse cx="100" cy="100" rx="30" ry="8"/>
      <ellipse cx="250" cy="80" rx="40" ry="10"/>
      <ellipse cx="180" cy="180" rx="35" ry="8"/>
      <ellipse cx="320" cy="160" rx="30" ry="9"/>
    </g>
    <!-- Glossy finish -->
    <path d="M0 60 L380 0 L380 30 Q200 60 0 90 Z" fill="#fff" opacity="0.2"/>
  </g>
  <rect x="180" y="60" width="152" height="35" rx="5" fill="#fef3c7" stroke="#78350f" stroke-width="2"/>
  <text x="256" y="83" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#78350f" text-anchor="middle">LAMINATE SHEET</text>
</svg>
