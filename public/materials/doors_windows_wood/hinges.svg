<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdf6e9"/>
      <stop offset="1" stop-color="#f0e0c0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <ellipse cx="256" cy="455" rx="180" ry="14" fill="#000" opacity="0.15"/>
  <!-- Hinges -->
  <g transform="translate(120,130)">
    <!-- Hinge 1 -->
    <rect x="0" y="0" width="60" height="120" rx="3" fill="#a1a1aa" stroke="#27272a" stroke-width="2.5"/>
    <rect x="60" y="0" width="8" height="120" fill="#52525b" stroke="#18181b" stroke-width="2"/>
    <rect x="68" y="0" width="60" height="120" rx="3" fill="#a1a1aa" stroke="#27272a" stroke-width="2.5"/>
    <!-- Pin -->
    <circle cx="64" cy="10" r="6" fill="#27272a"/>
    <circle cx="64" cy="60" r="6" fill="#27272a"/>
    <circle cx="64" cy="110" r="6" fill="#27272a"/>
    <!-- Screw holes -->
    <circle cx="20" cy="20" r="4" fill="#0f172a"/>
    <circle cx="40" cy="20" r="4" fill="#0f172a"/>
    <circle cx="20" cy="100" r="4" fill="#0f172a"/>
    <circle cx="40" cy="100" r="4" fill="#0f172a"/>
    <circle cx="88" cy="20" r="4" fill="#0f172a"/>
    <circle cx="108" cy="20" r="4" fill="#0f172a"/>
    <circle cx="88" cy="100" r="4" fill="#0f172a"/>
    <circle cx="108" cy="100" r="4" fill="#0f172a"/>
    <!-- Highlight -->
    <rect x="3" y="3" width="20" height="114" fill="#fff" opacity="0.3"/>
    <rect x="71" y="3" width="20" height="114" fill="#fff" opacity="0.3"/>
  </g>
  <!-- Second hinge below -->
  <g transform="translate(180,290)">
    <rect x="0" y="0" width="60" height="100" rx="3" fill="#a1a1aa" stroke="#27272a" stroke-width="2.5"/>
    <rect x="60" y="0" width="8" height="100" fill="#52525b" stroke="#18181b" stroke-width="2"/>
    <rect x="68" y="0" width="60" height="100" rx="3" fill="#a1a1aa" stroke="#27272a" stroke-width="2.5"/>
    <circle cx="64" cy="15" r="5" fill="#27272a"/>
    <circle cx="64" cy="85" r="5" fill="#27272a"/>
    <circle cx="25" cy="25" r="3" fill="#0f172a"/>
    <circle cx="25" cy="75" r="3" fill="#0f172a"/>
    <circle cx="103" cy="25" r="3" fill="#0f172a"/>
    <circle cx="103" cy="75" r="3" fill="#0f172a"/>
    <rect x="3" y="3" width="18" height="94" fill="#fff" opacity="0.3"/>
    <rect x="71" y="3" width="18" height="94" fill="#fff" opacity="0.3"/>
  </g>
  <rect x="180" y="50" width="152" height="35" rx="5" fill="#fef3c7" stroke="#78350f" stroke-width="2"/>
  <text x="256" y="73" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#78350f" text-anchor="middle">DOOR HINGES</text>
</svg>
