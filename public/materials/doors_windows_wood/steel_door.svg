<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdf6e9"/>
      <stop offset="1" stop-color="#f0e0c0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <ellipse cx="256" cy="455" rx="180" ry="14" fill="#000" opacity="0.15"/>
  <!-- Steel/metal security door -->
  <g transform="translate(146,80)">
    <rect x="-15" y="-15" width="250" height="380" fill="#1e293b" stroke="#0f172a" stroke-width="3"/>
    <rect x="0" y="0" width="220" height="350" fill="#475569" stroke="#0f172a" stroke-width="2"/>
    <!-- Metal panels -->
    <rect x="20" y="20" width="180" height="100" rx="3" fill="#334155" stroke="#0f172a" stroke-width="2"/>
    <rect x="20" y="135" width="180" height="100" rx="3" fill="#334155" stroke="#0f172a" stroke-width="2"/>
    <rect x="20" y="250" width="180" height="80" rx="3" fill="#334155" stroke="#0f172a" stroke-width="2"/>
    <!-- Rivets -->
    <g fill="#0f172a">
      <circle cx="35" cy="35" r="3"/>
      <circle cx="185" cy="35" r="3"/>
      <circle cx="35" cy="105" r="3"/>
      <circle cx="185" cy="105" r="3"/>
      <circle cx="35" cy="150" r="3"/>
      <circle cx="185" cy="150" r="3"/>
      <circle cx="35" cy="220" r="3"/>
      <circle cx="185" cy="220" r="3"/>
      <circle cx="35" cy="265" r="3"/>
      <circle cx="185" cy="265" r="3"/>
      <circle cx="35" cy="315" r="3"/>
      <circle cx="185" cy="315" r="3"/>
    </g>
    <!-- Peephole -->
    <circle cx="110" cy="70" r="6" fill="#fbbf24" stroke="#0f172a" stroke-width="2"/>
    <!-- Handle -->
    <rect x="180" y="180" width="12" height="50" rx="3" fill="#1f2937" stroke="#0f172a" stroke-width="2"/>
    <rect x="172" y="195" width="20" height="20" rx="2" fill="#facc15" stroke="#713f12" stroke-width="2"/>
    <!-- Highlights -->
    <rect x="3" y="3" width="6" height="344" fill="#fff" opacity="0.3"/>
  </g>
  <rect x="180" y="40" width="152" height="35" rx="5" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
  <text x="256" y="63" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#1e3a8a" text-anchor="middle">STEEL SAFETY DOOR</text>
</svg>
