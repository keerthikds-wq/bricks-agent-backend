<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdf6e9"/>
      <stop offset="1" stop-color="#f0e0c0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <ellipse cx="256" cy="455" rx="180" ry="14" fill="#000" opacity="0.15"/>
  <!-- Plywood sheets stacked -->
  <g transform="translate(60,180)">
    <rect x="0" y="120" width="392" height="20" fill="#92400e" stroke="#451a03" stroke-width="2"/>
    <rect x="0" y="100" width="392" height="20" fill="#a16207" stroke="#451a03" stroke-width="2"/>
    <rect x="0" y="80" width="392" height="20" fill="#92400e" stroke="#451a03" stroke-width="2"/>
    <rect x="0" y="60" width="392" height="20" fill="#a16207" stroke="#451a03" stroke-width="2"/>
    <rect x="0" y="40" width="392" height="20" fill="#92400e" stroke="#451a03" stroke-width="2"/>
    <rect x="0" y="20" width="392" height="20" fill="#a16207" stroke="#451a03" stroke-width="2"/>
    <rect x="0" y="0" width="392" height="20" fill="#92400e" stroke="#451a03" stroke-width="2"/>
    <!-- Top surface (top sheet) -->
    <polygon points="0,0 392,0 410,-15 18,-15" fill="#ca8a04" stroke="#451a03" stroke-width="2"/>
    <polygon points="392,0 410,-15 410,125 392,140" fill="#854d0e" stroke="#451a03" stroke-width="2"/>
    <!-- Wood grain on top -->
    <g stroke="#78350f" stroke-width="0.8" fill="none" opacity="0.5">
      <path d="M30 -10 L380 -10"/>
      <path d="M50 -7 Q200 -3 380 -7"/>
      <path d="M30 -4 Q200 0 380 -4"/>
    </g>
    <!-- Side layer lines -->
    <g stroke="#451a03" stroke-width="0.5" opacity="0.6">
      <line x1="400" y1="-5" x2="400" y2="130"/>
      <line x1="402" y1="-5" x2="402" y2="130"/>
    </g>
  </g>
  <rect x="180" y="80" width="152" height="35" rx="5" fill="#fef3c7" stroke="#78350f" stroke-width="2"/>
  <text x="256" y="103" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#78350f" text-anchor="middle">PLYWOOD</text>
</svg>
