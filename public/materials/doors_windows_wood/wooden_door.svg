<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdf6e9"/>
      <stop offset="1" stop-color="#f0e0c0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <ellipse cx="256" cy="455" rx="180" ry="14" fill="#000" opacity="0.15"/>
  <!-- Wooden door -->
  <g transform="translate(146,80)">
    <rect x="-10" y="-10" width="240" height="370" rx="2" fill="#451a03" stroke="#1c0701" stroke-width="3"/>
    <rect x="0" y="0" width="220" height="350" fill="#92400e" stroke="#451a03" stroke-width="2"/>
    <!-- Wood grain -->
    <g stroke="#78350f" stroke-width="1" fill="none" opacity="0.6">
      <path d="M10 30 Q60 50 110 30 Q160 10 210 35"/>
      <path d="M10 80 Q60 100 110 80 Q160 60 210 85"/>
      <path d="M10 130 Q60 150 110 130 Q160 110 210 135"/>
      <path d="M10 180 Q60 200 110 180 Q160 160 210 185"/>
      <path d="M10 230 Q60 250 110 230 Q160 210 210 235"/>
      <path d="M10 280 Q60 300 110 280 Q160 260 210 285"/>
      <path d="M10 330 Q60 350 110 330 Q160 310 210 335"/>
    </g>
    <!-- Panels -->
    <rect x="20" y="20" width="80" height="120" rx="3" fill="#78350f" stroke="#451a03" stroke-width="2"/>
    <rect x="25" y="25" width="70" height="110" rx="2" fill="none" stroke="#451a03" stroke-width="1"/>
    <rect x="120" y="20" width="80" height="120" rx="3" fill="#78350f" stroke="#451a03" stroke-width="2"/>
    <rect x="125" y="25" width="70" height="110" rx="2" fill="none" stroke="#451a03" stroke-width="1"/>
    <rect x="20" y="160" width="80" height="170" rx="3" fill="#78350f" stroke="#451a03" stroke-width="2"/>
    <rect x="25" y="165" width="70" height="160" rx="2" fill="none" stroke="#451a03" stroke-width="1"/>
    <rect x="120" y="160" width="80" height="170" rx="3" fill="#78350f" stroke="#451a03" stroke-width="2"/>
    <rect x="125" y="165" width="70" height="160" rx="2" fill="none" stroke="#451a03" stroke-width="1"/>
    <!-- Handle -->
    <circle cx="190" cy="200" r="8" fill="#facc15" stroke="#854d0e" stroke-width="2"/>
    <rect x="186" y="200" width="8" height="30" fill="#facc15" stroke="#854d0e" stroke-width="1.5"/>
    <!-- Hinges -->
    <rect x="0" y="40" width="8" height="30" fill="#737373"/>
    <rect x="0" y="300" width="8" height="30" fill="#737373"/>
  </g>
</svg>
