<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eaf4f4"/>
      <stop offset="1" stop-color="#cfe5e5"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <ellipse cx="256" cy="455" rx="180" ry="14" fill="#000" opacity="0.15"/>
  <!-- Modular switch plate -->
  <g transform="translate(106,86)">
    <rect x="0" y="0" width="300" height="340" rx="15" fill="#fafafa" stroke="#0f172a" stroke-width="4"/>
    <rect x="20" y="20" width="260" height="300" rx="8" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
    <!-- Switch 1 -->
    <rect x="50" y="50" width="100" height="70" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
    <rect x="60" y="60" width="80" height="50" rx="4" fill="#fff" stroke="#94a3b8" stroke-width="1.5"/>
    <circle cx="100" cy="85" r="6" fill="#22c55e"/>
    <!-- Switch 2 -->
    <rect x="160" y="50" width="100" height="70" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
    <rect x="170" y="60" width="80" height="50" rx="4" fill="#fff" stroke="#94a3b8" stroke-width="1.5"/>
    <circle cx="210" cy="85" r="6" fill="#94a3b8"/>
    <!-- Socket 3-pin -->
    <rect x="50" y="150" width="210" height="140" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
    <!-- L pin -->
    <rect x="100" y="200" width="8" height="28" rx="2" fill="#0f172a"/>
    <!-- N pin -->
    <rect x="200" y="200" width="8" height="28" rx="2" fill="#0f172a"/>
    <!-- E pin (top, larger) -->
    <rect x="151" y="175" width="8" height="32" rx="2" fill="#0f172a"/>
    <!-- Decorative -->
    <text x="155" y="310" font-family="Arial, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">16A</text>
  </g>
  <rect x="180" y="40" width="152" height="35" rx="5" fill="#fee2e2" stroke="#991b1b" stroke-width="2"/>
  <text x="256" y="63" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#7f1d1d" text-anchor="middle">SWITCH + SOCKET</text>
</svg>
