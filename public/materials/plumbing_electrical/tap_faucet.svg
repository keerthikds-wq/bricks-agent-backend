<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eaf4f4"/>
      <stop offset="1" stop-color="#cfe5e5"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <ellipse cx="256" cy="455" rx="180" ry="14" fill="#000" opacity="0.15"/>
  <!-- Chrome tap / faucet -->
  <g transform="translate(256,256)">
    <!-- Base -->
    <ellipse cx="0" cy="120" rx="60" ry="15" fill="#a1a1aa" stroke="#27272a" stroke-width="3"/>
    <rect x="-50" y="60" width="100" height="60" fill="#e4e4e7" stroke="#27272a" stroke-width="3"/>
    <!-- Vertical body -->
    <rect x="-20" y="-30" width="40" height="100" fill="#e4e4e7" stroke="#27272a" stroke-width="3"/>
    <!-- Horizontal spout -->
    <path d="M-20 -30 Q-20 -80 -80 -80 L-80 -50 Q-50 -50 -50 -10" fill="#e4e4e7" stroke="#27272a" stroke-width="3"/>
    <!-- Handle -->
    <rect x="-15" y="-50" width="30" height="20" rx="4" fill="#0c4a6e" stroke="#082f49" stroke-width="2"/>
    <rect x="-25" y="-58" width="50" height="12" rx="3" fill="#0ea5e9" stroke="#082f49" stroke-width="2"/>
    <!-- Highlights -->
    <rect x="-15" y="-25" width="6" height="90" fill="#fff" opacity="0.6"/>
    <!-- Water drop -->
    <path d="M-65 -10 Q-65 5 -55 10 Q-45 5 -45 -10 Q-55 -25 -65 -10 Z" fill="#3b82f6" opacity="0.8"/>
  </g>
  <rect x="180" y="80" width="152" height="35" rx="5" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <text x="256" y="103" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#14532d" text-anchor="middle">TAP / FAUCET</text>
</svg>
