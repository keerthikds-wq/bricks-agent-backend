<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eaf4f4"/>
      <stop offset="1" stop-color="#cfe5e5"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <ellipse cx="256" cy="455" rx="180" ry="14" fill="#000" opacity="0.15"/>
  <!-- Plastic water tank -->
  <g transform="translate(256,260)">
    <!-- Tank body -->
    <ellipse cx="0" cy="120" rx="140" ry="25" fill="#1e40af" stroke="#1e3a8a" stroke-width="3"/>
    <path d="M-140 120 L-130 -100 Q-120 -130 0 -135 Q120 -130 130 -100 L140 120" fill="#2563eb" stroke="#1e3a8a" stroke-width="3"/>
    <ellipse cx="0" cy="-110" rx="125" ry="25" fill="#1e3a8a"/>
    <ellipse cx="0" cy="-115" rx="120" ry="20" fill="#1e40af"/>
    <!-- Lid -->
    <ellipse cx="0" cy="-125" rx="60" ry="12" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="2"/>
    <ellipse cx="0" cy="-130" rx="55" ry="10" fill="#3b82f6"/>
    <circle cx="0" cy="-128" r="8" fill="#1e3a8a"/>
    <!-- Ribs -->
    <line x1="-130" y1="-50" x2="130" y2="-50" stroke="#1e3a8a" stroke-width="2"/>
    <line x1="-132" y1="0" x2="132" y2="0" stroke="#1e3a8a" stroke-width="2"/>
    <line x1="-134" y1="50" x2="134" y2="50" stroke="#1e3a8a" stroke-width="2"/>
    <!-- Highlight -->
    <path d="M-120 -90 Q-115 0 -105 100" stroke="#fff" stroke-width="8" fill="none" opacity="0.3"/>
    <!-- Capacity label -->
    <rect x="-50" y="-30" width="100" height="40" rx="4" fill="#fff" opacity="0.9"/>
    <text y="-3" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#1e3a8a" text-anchor="middle">1000 L</text>
  </g>
  <rect x="180" y="60" width="152" height="35" rx="5" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <text x="256" y="83" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#14532d" text-anchor="middle">WATER TANK</text>
</svg>
