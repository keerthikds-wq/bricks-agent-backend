<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eaf4f4"/>
      <stop offset="1" stop-color="#cfe5e5"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <ellipse cx="256" cy="455" rx="180" ry="14" fill="#000" opacity="0.15"/>
  <!-- Spool of electrical wire -->
  <g transform="translate(256,256)">
    <!-- Outer rim -->
    <circle r="160" fill="#fafafa" stroke="#27272a" stroke-width="3"/>
    <circle r="150" fill="none" stroke="#27272a" stroke-width="2"/>
    <!-- Wound wire layers -->
    <circle r="140" fill="none" stroke="#dc2626" stroke-width="6"/>
    <circle r="125" fill="none" stroke="#dc2626" stroke-width="6"/>
    <circle r="110" fill="none" stroke="#dc2626" stroke-width="6"/>
    <circle r="95" fill="none" stroke="#dc2626" stroke-width="6"/>
    <circle r="80" fill="none" stroke="#dc2626" stroke-width="6"/>
    <circle r="65" fill="none" stroke="#dc2626" stroke-width="6"/>
    <!-- Center hub -->
    <circle r="50" fill="#fafafa" stroke="#27272a" stroke-width="3"/>
    <circle r="20" fill="#27272a"/>
    <text y="6" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">2.5</text>
  </g>
  <!-- Loose wire end -->
  <path d="M380 200 Q420 180 450 200 Q460 220 440 240" stroke="#dc2626" stroke-width="6" fill="none"/>
  <!-- Copper exposed end -->
  <circle cx="440" cy="240" r="5" fill="#f97316"/>
  <rect x="180" y="60" width="152" height="35" rx="5" fill="#fee2e2" stroke="#991b1b" stroke-width="2"/>
  <text x="256" y="83" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#7f1d1d" text-anchor="middle">WIRE 2.5 SQMM</text>
</svg>
