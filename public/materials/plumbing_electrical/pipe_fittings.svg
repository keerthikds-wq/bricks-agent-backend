<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eaf4f4"/>
      <stop offset="1" stop-color="#cfe5e5"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <ellipse cx="256" cy="455" rx="180" ry="14" fill="#000" opacity="0.15"/>
  <!-- Mix of fittings -->
  <!-- Elbow -->
  <g transform="translate(140,180)">
    <path d="M0 60 L0 30 Q0 0 30 0 L60 0 L60 -30 L-30 -30 L-30 60 Z" fill="#f1f5f9" stroke="#0f172a" stroke-width="3"/>
    <rect x="-30" y="50" width="60" height="20" fill="#cbd5e1" stroke="#0f172a" stroke-width="2"/>
    <rect x="50" y="-30" width="20" height="60" fill="#cbd5e1" stroke="#0f172a" stroke-width="2"/>
  </g>
  <!-- T-joint -->
  <g transform="translate(280,170)">
    <rect x="0" y="20" width="120" height="40" fill="#f1f5f9" stroke="#0f172a" stroke-width="3"/>
    <rect x="45" y="-30" width="30" height="60" fill="#f1f5f9" stroke="#0f172a" stroke-width="3"/>
    <rect x="-15" y="20" width="20" height="40" fill="#cbd5e1" stroke="#0f172a" stroke-width="2"/>
    <rect x="115" y="20" width="20" height="40" fill="#cbd5e1" stroke="#0f172a" stroke-width="2"/>
    <rect x="40" y="-40" width="40" height="20" fill="#cbd5e1" stroke="#0f172a" stroke-width="2"/>
  </g>
  <!-- Coupler -->
  <g transform="translate(180,330)">
    <rect x="0" y="0" width="160" height="40" rx="6" fill="#f1f5f9" stroke="#0f172a" stroke-width="3"/>
    <rect x="-15" y="5" width="25" height="30" fill="#cbd5e1" stroke="#0f172a" stroke-width="2"/>
    <rect x="150" y="5" width="25" height="30" fill="#cbd5e1" stroke="#0f172a" stroke-width="2"/>
    <line x1="40" y1="0" x2="40" y2="40" stroke="#94a3b8" stroke-width="2"/>
    <line x1="80" y1="0" x2="80" y2="40" stroke="#94a3b8" stroke-width="2"/>
    <line x1="120" y1="0" x2="120" y2="40" stroke="#94a3b8" stroke-width="2"/>
  </g>
  <rect x="180" y="60" width="152" height="35" rx="5" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <text x="256" y="83" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#14532d" text-anchor="middle">PIPE FITTINGS</text>
</svg>
