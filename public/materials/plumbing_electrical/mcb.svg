<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eaf4f4"/>
      <stop offset="1" stop-color="#cfe5e5"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <ellipse cx="256" cy="455" rx="180" ry="14" fill="#000" opacity="0.15"/>
  <!-- MCB / Circuit breaker -->
  <g transform="translate(160,140)">
    <rect x="0" y="0" width="192" height="240" rx="6" fill="#fafafa" stroke="#0f172a" stroke-width="3"/>
    <!-- Top terminal -->
    <rect x="40" y="-20" width="112" height="30" fill="#71717a" stroke="#0f172a" stroke-width="2"/>
    <rect x="60" y="-30" width="20" height="10" fill="#a1a1aa"/>
    <rect x="112" y="-30" width="20" height="10" fill="#a1a1aa"/>
    <!-- Bottom terminal -->
    <rect x="40" y="230" width="112" height="30" fill="#71717a" stroke="#0f172a" stroke-width="2"/>
    <rect x="60" y="260" width="20" height="10" fill="#a1a1aa"/>
    <rect x="112" y="260" width="20" height="10" fill="#a1a1aa"/>
    <!-- Switch lever -->
    <rect x="76" y="80" width="40" height="80" rx="4" fill="#dc2626" stroke="#7f1d1d" stroke-width="2"/>
    <rect x="80" y="86" width="32" height="20" fill="#fff" opacity="0.4"/>
    <!-- ON/OFF labels -->
    <text x="96" y="50" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">ON</text>
    <text x="96" y="200" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">OFF</text>
    <!-- Branding strip -->
    <rect x="15" y="180" width="162" height="20" fill="#e5e7eb" stroke="#94a3b8" stroke-width="1"/>
    <text x="96" y="195" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#0f172a" text-anchor="middle">C32 MCB</text>
  </g>
  <rect x="180" y="60" width="152" height="35" rx="5" fill="#fee2e2" stroke="#991b1b" stroke-width="2"/>
  <text x="256" y="83" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#7f1d1d" text-anchor="middle">MCB BREAKER</text>
</svg>
