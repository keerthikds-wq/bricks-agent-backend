<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef2f7"/>
      <stop offset="1" stop-color="#d8e0ea"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <ellipse cx="256" cy="455" rx="180" ry="14" fill="#000" opacity="0.15"/>
  <!-- Granite slab leaning -->
  <g transform="translate(80,80) rotate(-3 176 180)">
    <polygon points="0,30 352,0 360,340 8,360" fill="#1f2937" stroke="#0f172a" stroke-width="3"/>
    <!-- Granite speckles -->
    <g>
      <circle cx="60" cy="80" r="3" fill="#fbbf24"/>
      <circle cx="120" cy="120" r="2" fill="#fcd34d"/>
      <circle cx="200" cy="60" r="3" fill="#fbbf24"/>
      <circle cx="280" cy="100" r="2" fill="#fcd34d"/>
      <circle cx="80" cy="180" r="3" fill="#fbbf24"/>
      <circle cx="170" cy="200" r="2" fill="#fcd34d"/>
      <circle cx="240" cy="170" r="3" fill="#fbbf24"/>
      <circle cx="310" cy="220" r="2" fill="#fcd34d"/>
      <circle cx="50" cy="260" r="3" fill="#fbbf24"/>
      <circle cx="150" cy="290" r="2" fill="#fcd34d"/>
      <circle cx="220" cy="270" r="3" fill="#fbbf24"/>
      <circle cx="300" cy="310" r="2" fill="#fcd34d"/>
      <circle cx="100" cy="320" r="2" fill="#e5e7eb"/>
      <circle cx="190" cy="140" r="2" fill="#e5e7eb"/>
      <circle cx="270" cy="240" r="2" fill="#e5e7eb"/>
      <circle cx="40" cy="140" r="1.5" fill="#94a3b8"/>
      <circle cx="160" cy="80" r="1.5" fill="#94a3b8"/>
      <circle cx="250" cy="120" r="1.5" fill="#94a3b8"/>
      <circle cx="80" cy="240" r="1.5" fill="#94a3b8"/>
      <circle cx="200" cy="240" r="1.5" fill="#94a3b8"/>
      <circle cx="280" cy="180" r="1.5" fill="#94a3b8"/>
    </g>
    <!-- Polish highlight -->
    <polygon points="0,30 80,28 90,340 8,360" fill="#fff" opacity="0.15"/>
  </g>
  <rect x="170" y="40" width="172" height="35" rx="5" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
  <text x="256" y="63" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">GRANITE SLAB</text>
</svg>
