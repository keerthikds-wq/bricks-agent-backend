<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef2f7"/>
      <stop offset="1" stop-color="#d8e0ea"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <ellipse cx="256" cy="455" rx="180" ry="14" fill="#000" opacity="0.15"/>
  <!-- Floor tile in 3D perspective -->
  <g transform="translate(80,140)">
    <polygon points="0,80 352,80 352,260 0,260" fill="#f8fafc" stroke="#334155" stroke-width="3"/>
    <!-- Tile pattern -->
    <line x1="88" y1="80" x2="88" y2="260" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="176" y1="80" x2="176" y2="260" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="264" y1="80" x2="264" y2="260" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="0" y1="170" x2="352" y2="170" stroke="#cbd5e1" stroke-width="2"/>
    <!-- Marble veining -->
    <g stroke="#94a3b8" stroke-width="1.2" fill="none" opacity="0.7">
      <path d="M20 110 Q60 130 100 115 Q140 100 180 130"/>
      <path d="M200 200 Q240 180 280 200 Q310 215 340 195"/>
      <path d="M30 220 Q70 240 110 225"/>
      <path d="M260 90 Q290 105 330 95"/>
      <path d="M150 230 Q190 215 230 235"/>
    </g>
    <g stroke="#cbd5e1" stroke-width="0.8" fill="none" opacity="0.5">
      <path d="M50 140 Q90 160 120 145"/>
      <path d="M210 130 Q250 145 290 130"/>
      <path d="M70 190 Q110 205 150 195"/>
    </g>
    <!-- Subtle highlight -->
    <rect x="0" y="80" width="352" height="20" fill="#fff" opacity="0.5"/>
  </g>
  <!-- Stacked tiles edge -->
  <g transform="translate(80,140)">
    <polygon points="0,80 352,80 360,72 8,72" fill="#e2e8f0" stroke="#334155" stroke-width="2"/>
    <polygon points="352,80 360,72 360,252 352,260" fill="#cbd5e1" stroke="#334155" stroke-width="2"/>
  </g>
  <!-- Label -->
  <rect x="170" y="60" width="172" height="40" rx="5" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
  <text x="256" y="86" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle">VITRIFIED TILE</text>
</svg>
