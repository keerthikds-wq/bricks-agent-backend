<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef2f7"/>
      <stop offset="1" stop-color="#d8e0ea"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <ellipse cx="256" cy="455" rx="180" ry="14" fill="#000" opacity="0.15"/>
  <!-- Gypsum board sheet -->
  <g transform="translate(60,160)">
    <rect x="0" y="0" width="392" height="200" fill="#fef3c7" stroke="#92400e" stroke-width="3"/>
    <!-- Paper texture -->
    <g stroke="#fcd34d" stroke-width="0.5" opacity="0.6">
      <line x1="0" y1="30" x2="392" y2="30"/>
      <line x1="0" y1="60" x2="392" y2="60"/>
      <line x1="0" y1="90" x2="392" y2="90"/>
      <line x1="0" y1="120" x2="392" y2="120"/>
      <line x1="0" y1="150" x2="392" y2="150"/>
      <line x1="0" y1="180" x2="392" y2="180"/>
    </g>
    <!-- Logo / branding -->
    <rect x="120" y="70" width="160" height="60" rx="4" fill="none" stroke="#92400e" stroke-width="2"/>
    <text x="200" y="105" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="#92400e" text-anchor="middle">GYPSUM</text>
    <text x="200" y="125" font-family="Arial, sans-serif" font-size="12" fill="#92400e" text-anchor="middle">12.5mm BOARD</text>
    <!-- Edge highlight (paper layer) -->
    <rect x="0" y="0" width="392" height="5" fill="#92400e"/>
    <rect x="0" y="195" width="392" height="5" fill="#92400e"/>
  </g>
  <rect x="180" y="80" width="152" height="35" rx="5" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
  <text x="256" y="103" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">GYPSUM BOARD</text>
</svg>
