  <rect x="170" y="60" width="172" height="40" rx="5" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
  <text x="256" y="86" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#1e3a8a" text-anchor="middle">WALL TILE</text>
