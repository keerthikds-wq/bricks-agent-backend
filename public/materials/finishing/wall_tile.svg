    <line x1="0" y1="170" x2="352" y2="170" stroke="#0ea5e9" stroke-width="2"/>
    <line x1="0" y1="215" x2="352" y2="215" stroke="#0ea5e9" stroke-width="2"/>
    <line x1="88" y1="80" x2="88" y2="125" stroke="#0ea5e9" stroke-width="2"/>
    <line x1="176" y1="80" x2="176" y2="125" stroke="#0ea5e9" stroke-width="2"/>
    <line x1="264" y1="80" x2="264" y2="125" stroke="#0ea5e9" stroke-width="2"/>
    <line x1="44" y1="125" x2="44" y2="170" stroke="#0ea5e9" stroke-width="2"/>
    <line x1="132" y1="125" x2="132" y2="170" stroke="#0ea5e9" stroke-width="2"/>
    <line x1="220" y1="125" x2="220" y2="170" stroke="#0ea5e9" stroke-width="2"/>
    <line x1="308" y1="125" x2="308" y2="170" stroke="#0ea5e9" stroke-width="2"/>
    <line x1="88" y1="170" x2="88" y2="215" stroke="#0ea5e9" stroke-width="2"/>
    <line x1="176" y1="170" x2="176" y2="215" stroke="#0ea5e9" stroke-width="2"/>
    <line x1="264" y1="170" x2="264" y2="215" stroke="#0ea5e9" stroke-width="2"/>
    <line x1="44" y1="215" x2="44" y2="260" stroke="#0ea5e9" stroke-width="2"/>
    <line x1="132" y1="215" x2="132" y2="260" stroke="#0ea5e9" stroke-width="2"/>
    <line x1="220" y1="215" x2="220" y2="260" stroke="#0ea5e9" stroke-width="2"/>
    <line x1="308" y1="215" x2="308" y2="260" stroke="#0ea5e9" stroke-width="2"/>
    <!-- Shine -->
    <rect x="0" y="80" width="352" height="15" fill="#fff" opacity="0.4"/>
