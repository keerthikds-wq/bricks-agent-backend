<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5efe6"/>
      <stop offset="1" stop-color="#e8ddc9"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <ellipse cx="256" cy="455" rx="180" ry="14" fill="#000" opacity="0.15"/>
  <!-- Nails and screws scattered -->
  <g>
    <!-- Nail 1 -->
    <g transform="translate(120,180) rotate(-15)">
      <circle cx="0" cy="0" r="14" fill="#71717a" stroke="#27272a" stroke-width="2"/>
      <rect x="-3" y="14" width="6" height="120" fill="#a1a1aa" stroke="#27272a" stroke-width="2"/>
      <polygon points="-3,134 3,134 0,150" fill="#52525b" stroke="#27272a" stroke-width="1.5"/>
      <ellipse cx="-5" cy="-3" rx="4" ry="2" fill="#fff" opacity="0.6"/>
    </g>
    <!-- Nail 2 -->
    <g transform="translate(220,160) rotate(20)">
      <circle cx="0" cy="0" r="12" fill="#71717a" stroke="#27272a" stroke-width="2"/>
      <rect x="-3" y="12" width="6" height="100" fill="#a1a1aa" stroke="#27272a" stroke-width="2"/>
      <polygon points="-3,112 3,112 0,128" fill="#52525b" stroke="#27272a" stroke-width="1.5"/>
    </g>
    <!-- Screw 1 -->
    <g transform="translate(320,170) rotate(-25)">
      <circle cx="0" cy="0" r="15" fill="#d4d4d8" stroke="#27272a" stroke-width="2"/>
      <line x1="-10" y1="0" x2="10" y2="0" stroke="#27272a" stroke-width="2"/>
      <line x1="0" y1="-10" x2="0" y2="10" stroke="#27272a" stroke-width="2"/>
      <rect x="-4" y="15" width="8" height="110" fill="#a1a1aa" stroke="#27272a" stroke-width="2"/>
      <!-- Threads -->
      <g stroke="#27272a" stroke-width="1" fill="none">
        <path d="M-4 25 L4 30"/>
        <path d="M-4 35 L4 40"/>
        <path d="M-4 45 L4 50"/>
        <path d="M-4 55 L4 60"/>
        <path d="M-4 65 L4 70"/>
        <path d="M-4 75 L4 80"/>
        <path d="M-4 85 L4 90"/>
        <path d="M-4 95 L4 100"/>
        <path d="M-4 105 L4 110"/>
        <path d="M-4 115 L4 120"/>
      </g>
      <polygon points="-4,125 4,125 0,140" fill="#52525b"/>
    </g>
    <!-- Screw 2 -->
    <g transform="translate(400,200) rotate(15)">
      <circle cx="0" cy="0" r="13" fill="#d4d4d8" stroke="#27272a" stroke-width="2"/>
      <line x1="-9" y1="0" x2="9" y2="0" stroke="#27272a" stroke-width="2"/>
      <line x1="0" y1="-9" x2="0" y2="9" stroke="#27272a" stroke-width="2"/>
      <rect x="-3" y="13" width="6" height="90" fill="#a1a1aa" stroke="#27272a" stroke-width="2"/>
      <polygon points="-3,103 3,103 0,115" fill="#52525b"/>
    </g>
    <!-- Bottom scattered nails -->
    <g transform="translate(150,360) rotate(70)">
      <circle cx="0" cy="0" r="10" fill="#71717a" stroke="#27272a" stroke-width="2"/>
      <rect x="-2" y="10" width="4" height="60" fill="#a1a1aa" stroke="#27272a" stroke-width="2"/>
      <polygon points="-2,70 2,70 0,80" fill="#52525b"/>
    </g>
    <g transform="translate(280,380) rotate(110)">
      <circle cx="0" cy="0" r="11" fill="#71717a" stroke="#27272a" stroke-width="2"/>
      <rect x="-2" y="11" width="4" height="70" fill="#a1a1aa" stroke="#27272a" stroke-width="2"/>
      <polygon points="-2,81 2,81 0,93" fill="#52525b"/>
    </g>
  </g>
  <rect x="170" y="80" width="172" height="35" rx="5" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="256" y="103" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#7c2d12" text-anchor="middle">NAILS &amp; SCREWS</text>
</svg>
