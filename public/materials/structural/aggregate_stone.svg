<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5efe6"/>
      <stop offset="1" stop-color="#e8ddc9"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <ellipse cx="256" cy="455" rx="180" ry="14" fill="#000" opacity="0.15"/>
  <!-- Crushed stone aggregate pile -->
  <ellipse cx="256" cy="400" rx="190" ry="50" fill="#6b7280" opacity="0.4"/>
  <g stroke="#1f2937" stroke-width="2">
    <!-- Random stones, irregular shapes -->
    <polygon points="120,380 145,355 175,365 180,395 150,410" fill="#9ca3af"/>
    <polygon points="180,375 215,360 240,375 230,405 195,410" fill="#6b7280"/>
    <polygon points="240,370 275,355 305,365 300,400 260,410" fill="#9ca3af"/>
    <polygon points="305,375 340,360 370,375 365,405 320,410" fill="#6b7280"/>
    <polygon points="370,380 395,365 420,380 410,410 380,405" fill="#9ca3af"/>
    <!-- Middle row -->
    <polygon points="150,320 180,300 215,315 210,350 165,355" fill="#6b7280"/>
    <polygon points="215,310 250,295 285,310 275,345 225,350" fill="#9ca3af"/>
    <polygon points="285,315 320,300 355,315 345,345 295,350" fill="#6b7280"/>
    <polygon points="355,320 385,310 410,325 395,355 360,350" fill="#9ca3af"/>
    <!-- Top row -->
    <polygon points="195,265 225,250 260,260 250,295 210,300" fill="#9ca3af"/>
    <polygon points="260,265 295,250 330,265 320,295 275,300" fill="#6b7280"/>
    <polygon points="330,270 360,260 385,275 375,300 340,295" fill="#9ca3af"/>
    <!-- Peak -->
    <polygon points="240,215 270,200 300,215 290,245 250,250" fill="#6b7280"/>
  </g>
  <!-- Highlights -->
  <g fill="#d1d5db" opacity="0.7">
    <polygon points="125,365 140,360 145,370"/>
    <polygon points="245,305 260,300 265,310"/>
    <polygon points="265,225 280,215 285,225"/>
  </g>
  <!-- Label -->
  <rect x="170" y="130" width="172" height="40" rx="5" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="256" y="156" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#7c2d12" text-anchor="middle">AGGREGATE 20MM</text>
</svg>
