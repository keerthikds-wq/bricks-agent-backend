<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5efe6"/>
      <stop offset="1" stop-color="#e8ddc9"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <ellipse cx="256" cy="455" rx="180" ry="14" fill="#000" opacity="0.15"/>
  <!-- Concrete hollow block -->
  <g>
    <!-- 3D base -->
    <polygon points="100,360 256,300 412,360 412,420 256,460 100,420" fill="#9ca3af" stroke="#374151" stroke-width="3"/>
    <!-- Front face -->
    <rect x="100" y="200" width="312" height="220" fill="#d1d5db" stroke="#374151" stroke-width="3"/>
    <!-- Top -->
    <polygon points="100,200 256,140 412,200 256,260" fill="#e5e7eb" stroke="#374151" stroke-width="3"/>
    <!-- Side -->
    <polygon points="412,200 412,420 470,400 470,180" fill="#9ca3af" stroke="#374151" stroke-width="3"/>
    <!-- Holes (hollow) -->
    <ellipse cx="170" cy="170" rx="35" ry="12" fill="#1f2937"/>
    <ellipse cx="256" cy="155" rx="40" ry="14" fill="#1f2937"/>
    <ellipse cx="342" cy="170" rx="35" ry="12" fill="#1f2937"/>
    <!-- Hole shadows on front -->
    <rect x="135" y="170" width="70" height="160" fill="#1f2937" opacity="0.4"/>
    <rect x="216" y="155" width="80" height="175" fill="#1f2937" opacity="0.4"/>
    <rect x="307" y="170" width="70" height="160" fill="#1f2937" opacity="0.4"/>
    <!-- Texture -->
    <g fill="#6b7280" opacity="0.4">
      <circle cx="120" cy="380" r="1.5"/>
      <circle cx="380" cy="370" r="1.5"/>
      <circle cx="200" cy="400" r="1.5"/>
      <circle cx="320" cy="395" r="1.5"/>
    </g>
  </g>
</svg>
