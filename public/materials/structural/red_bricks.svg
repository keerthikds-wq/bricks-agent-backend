<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="brickBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3e2"/>
      <stop offset="1" stop-color="#fde4c0"/>
    </linearGradient>
    <linearGradient id="brickFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b91c1c"/>
      <stop offset="0.6" stop-color="#991b1b"/>
      <stop offset="1" stop-color="#7f1d1d"/>
    </linearGradient>
    <linearGradient id="brickTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dc2626"/>
      <stop offset="1" stop-color="#b91c1c"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#brickBg)"/>
  <ellipse cx="256" cy="445" rx="200" ry="20" fill="#000" opacity="0.15"/>
  
  <!-- Row 1 (bottom) -->
  <g>
    <rect x="80" y="360" width="120" height="55" fill="url(#brickFace)" stroke="#5b1010" stroke-width="2"/>
    <rect x="80" y="355" width="120" height="10" fill="url(#brickTop)" stroke="#5b1010" stroke-width="2"/>
    <rect x="200" y="360" width="120" height="55" fill="url(#brickFace)" stroke="#5b1010" stroke-width="2"/>
    <rect x="200" y="355" width="120" height="10" fill="url(#brickTop)" stroke="#5b1010" stroke-width="2"/>
    <rect x="320" y="360" width="120" height="55" fill="url(#brickFace)" stroke="#5b1010" stroke-width="2"/>
    <rect x="320" y="355" width="120" height="10" fill="url(#brickTop)" stroke="#5b1010" stroke-width="2"/>
  </g>
  
  <!-- Row 2 (offset) -->
  <g>
    <rect x="115" y="295" width="120" height="55" fill="url(#brickFace)" stroke="#5b1010" stroke-width="2"/>
    <rect x="115" y="290" width="120" height="10" fill="url(#brickTop)" stroke="#5b1010" stroke-width="2"/>
    <rect x="235" y="295" width="120" height="55" fill="url(#brickFace)" stroke="#5b1010" stroke-width="2"/>
    <rect x="235" y="290" width="120" height="10" fill="url(#brickTop)" stroke="#5b1010" stroke-width="2"/>
    <rect x="355" y="295" width="60" height="55" fill="url(#brickFace)" stroke="#5b1010" stroke-width="2"/>
    <rect x="355" y="290" width="60" height="10" fill="url(#brickTop)" stroke="#5b1010" stroke-width="2"/>
    <rect x="55" y="295" width="60" height="55" fill="url(#brickFace)" stroke="#5b1010" stroke-width="2"/>
    <rect x="55" y="290" width="60" height="10" fill="url(#brickTop)" stroke="#5b1010" stroke-width="2"/>
  </g>
  
  <!-- Row 3 -->
  <g>
    <rect x="80" y="230" width="120" height="55" fill="url(#brickFace)" stroke="#5b1010" stroke-width="2"/>
    <rect x="80" y="225" width="120" height="10" fill="url(#brickTop)" stroke="#5b1010" stroke-width="2"/>
    <rect x="200" y="230" width="120" height="55" fill="url(#brickFace)" stroke="#5b1010" stroke-width="2"/>
    <rect x="200" y="225" width="120" height="10" fill="url(#brickTop)" stroke="#5b1010" stroke-width="2"/>
    <rect x="320" y="230" width="120" height="55" fill="url(#brickFace)" stroke="#5b1010" stroke-width="2"/>
    <rect x="320" y="225" width="120" height="10" fill="url(#brickTop)" stroke="#5b1010" stroke-width="2"/>
  </g>
  
  <!-- Row 4 (top, offset) -->
  <g>
    <rect x="115" y="165" width="120" height="55" fill="url(#brickFace)" stroke="#5b1010" stroke-width="2"/>
    <rect x="115" y="160" width="120" height="10" fill="url(#brickTop)" stroke="#5b1010" stroke-width="2"/>
    <rect x="235" y="165" width="120" height="55" fill="url(#brickFace)" stroke="#5b1010" stroke-width="2"/>
    <rect x="235" y="160" width="120" height="10" fill="url(#brickTop)" stroke="#5b1010" stroke-width="2"/>
  </g>
  
  <!-- Texture dots on bricks -->
  <g fill="#5b1010" opacity="0.3">
    <circle cx="120" cy="385" r="2"/>
    <circle cx="160" cy="395" r="1.5"/>
    <circle cx="250" cy="380" r="2"/>
    <circle cx="280" cy="400" r="1.5"/>
    <circle cx="380" cy="385" r="2"/>
    <circle cx="155" cy="320" r="1.5"/>
    <circle cx="290" cy="315" r="2"/>
    <circle cx="180" cy="190" r="1.5"/>
    <circle cx="290" cy="195" r="2"/>
  </g>
</svg>
