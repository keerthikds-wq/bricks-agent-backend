<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5efe6"/>
      <stop offset="1" stop-color="#e8ddc9"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <ellipse cx="256" cy="455" rx="180" ry="14" fill="#000" opacity="0.15"/>
  <!-- Steel TMT rod bundle -->
  <g transform="translate(80,120)">
    <rect x="0" y="0" width="352" height="50" rx="10" fill="#475569" stroke="#1e293b" stroke-width="3"/>
    <rect x="5" y="5" width="342" height="20" rx="8" fill="#64748b" opacity="0.6"/>
  </g>
  <g stroke="#1e293b" stroke-width="2">
    <circle cx="120" cy="220" r="22" fill="#64748b"/>
    <circle cx="170" cy="220" r="22" fill="#64748b"/>
    <circle cx="220" cy="220" r="22" fill="#64748b"/>
    <circle cx="270" cy="220" r="22" fill="#64748b"/>
    <circle cx="320" cy="220" r="22" fill="#64748b"/>
    <circle cx="370" cy="220" r="22" fill="#64748b"/>
    <circle cx="145" cy="265" r="22" fill="#64748b"/>
    <circle cx="195" cy="265" r="22" fill="#64748b"/>
    <circle cx="245" cy="265" r="22" fill="#64748b"/>
    <circle cx="295" cy="265" r="22" fill="#64748b"/>
    <circle cx="345" cy="265" r="22" fill="#64748b"/>
  </g>
  <!-- Ribbed texture pattern on circles -->
  <g stroke="#1e293b" stroke-width="1.5" fill="none">
    <circle cx="120" cy="220" r="14"/>
    <circle cx="170" cy="220" r="14"/>
    <circle cx="220" cy="220" r="14"/>
    <circle cx="270" cy="220" r="14"/>
    <circle cx="320" cy="220" r="14"/>
    <circle cx="370" cy="220" r="14"/>
    <circle cx="145" cy="265" r="14"/>
    <circle cx="195" cy="265" r="14"/>
    <circle cx="245" cy="265" r="14"/>
    <circle cx="295" cy="265" r="14"/>
    <circle cx="345" cy="265" r="14"/>
  </g>
  <!-- Binding wire -->
  <path d="M100 240 Q256 200 400 240" stroke="#92400e" stroke-width="3" fill="none"/>
  <path d="M100 240 Q256 280 400 240" stroke="#92400e" stroke-width="3" fill="none"/>
  <!-- Label tag -->
  <rect x="180" y="340" width="152" height="50" rx="5" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="256" y="365" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#7c2d12" text-anchor="middle">TMT STEEL</text>
  <text x="256" y="383" font-family="Arial, sans-serif" font-size="13" fill="#7c2d12" text-anchor="middle">Fe-500 GRADE</text>
</svg>
