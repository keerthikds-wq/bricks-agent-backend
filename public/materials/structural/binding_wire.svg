<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5efe6"/>
      <stop offset="1" stop-color="#e8ddc9"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <ellipse cx="256" cy="455" rx="180" ry="14" fill="#000" opacity="0.15"/>
  <!-- Coil of binding wire -->
  <g transform="translate(256,256)">
    <ellipse cx="0" cy="0" rx="160" ry="140" fill="none" stroke="#71717a" stroke-width="8"/>
    <ellipse cx="0" cy="0" rx="140" ry="120" fill="none" stroke="#52525b" stroke-width="8"/>
    <ellipse cx="0" cy="0" rx="120" ry="100" fill="none" stroke="#71717a" stroke-width="8"/>
    <ellipse cx="0" cy="0" rx="100" ry="80" fill="none" stroke="#52525b" stroke-width="8"/>
    <ellipse cx="0" cy="0" rx="80" ry="60" fill="none" stroke="#71717a" stroke-width="8"/>
    <ellipse cx="0" cy="0" rx="60" ry="40" fill="none" stroke="#52525b" stroke-width="8"/>
    <ellipse cx="0" cy="0" rx="40" ry="20" fill="none" stroke="#71717a" stroke-width="8"/>
    <!-- Highlights -->
    <ellipse cx="-30" cy="-70" rx="40" ry="10" fill="#e4e4e7" opacity="0.6" transform="rotate(-20)"/>
  </g>
  <!-- Loose end -->
  <path d="M340 380 Q380 400 410 390" stroke="#52525b" stroke-width="5" fill="none"/>
  <!-- Label -->
  <rect x="170" y="100" width="172" height="40" rx="5" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="256" y="126" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#7c2d12" text-anchor="middle">BINDING WIRE</text>
</svg>
