<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5efe6"/>
      <stop offset="1" stop-color="#e8ddc9"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <ellipse cx="256" cy="455" rx="180" ry="14" fill="#000" opacity="0.15"/>
  <!-- Mixed concrete in wheelbarrow shape -->
  <ellipse cx="256" cy="290" rx="180" ry="70" fill="#6b7280"/>
  <ellipse cx="256" cy="280" rx="170" ry="60" fill="#9ca3af"/>
  <ellipse cx="256" cy="275" rx="160" ry="55" fill="#a1a1aa"/>
  <!-- Surface texture - aggregate visible -->
  <g>
    <circle cx="180" cy="265" r="4" fill="#4b5563"/>
    <circle cx="220" cy="280" r="3" fill="#374151"/>
    <circle cx="250" cy="260" r="5" fill="#4b5563"/>
    <circle cx="285" cy="285" r="3" fill="#374151"/>
    <circle cx="315" cy="265" r="4" fill="#4b5563"/>
    <circle cx="200" cy="290" r="3" fill="#374151"/>
    <circle cx="270" cy="295" r="4" fill="#4b5563"/>
    <circle cx="330" cy="290" r="3" fill="#374151"/>
    <circle cx="160" cy="280" r="3" fill="#4b5563"/>
    <circle cx="340" cy="275" r="3" fill="#374151"/>
  </g>
  <!-- Wet glisten -->
  <ellipse cx="220" cy="255" rx="40" ry="8" fill="#fff" opacity="0.3"/>
  <!-- Container outline -->
  <path d="M76 290 Q76 360 256 380 Q436 360 436 290" fill="none" stroke="#374151" stroke-width="4"/>
  <path d="M76 290 L70 250 L100 245 L120 280" fill="#9ca3af" stroke="#374151" stroke-width="3"/>
  <path d="M436 290 L442 250 L412 245 L392 280" fill="#9ca3af" stroke="#374151" stroke-width="3"/>
  <!-- Trowel -->
  <g transform="translate(330,170) rotate(35)">
    <rect x="0" y="0" width="80" height="35" rx="3" fill="#cbd5e1" stroke="#1e293b" stroke-width="2"/>
    <rect x="-30" y="10" width="35" height="15" rx="3" fill="#92400e" stroke="#451a03" stroke-width="2"/>
  </g>
  <!-- Label -->
  <rect x="170" y="100" width="172" height="40" rx="5" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="256" y="126" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#7c2d12" text-anchor="middle">READY-MIX CONCRETE</text>
</svg>
