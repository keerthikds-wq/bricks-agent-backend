<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="cementBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5efe6"/>
      <stop offset="1" stop-color="#e8ddc9"/>
    </linearGradient>
    <linearGradient id="bagBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6b7280"/>
      <stop offset="0.5" stop-color="#9ca3af"/>
      <stop offset="1" stop-color="#4b5563"/>
    </linearGradient>
    <linearGradient id="bagShade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000" stop-opacity="0.25"/>
      <stop offset="0.5" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.25"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#cementBg)"/>
  <ellipse cx="256" cy="450" rx="170" ry="18" fill="#000" opacity="0.18"/>
  <!-- Bag body -->
  <path d="M120 130 Q130 110 160 105 L352 105 Q382 110 392 130 L400 420 Q395 440 370 444 L142 444 Q117 440 112 420 Z" fill="url(#bagBody)" stroke="#374151" stroke-width="3"/>
  <path d="M120 130 Q130 110 160 105 L352 105 Q382 110 392 130 L400 420 Q395 440 370 444 L142 444 Q117 440 112 420 Z" fill="url(#bagShade)"/>
  <!-- Top fold -->
  <path d="M150 105 Q256 90 362 105 L355 130 Q256 118 157 130 Z" fill="#374151"/>
  <!-- Center stripe label -->
  <rect x="135" y="200" width="242" height="120" fill="#b91c1c"/>
  <rect x="135" y="200" width="242" height="120" fill="url(#bagShade)" opacity="0.3"/>
  <!-- Label text area -->
  <text x="256" y="245" font-family="Georgia, serif" font-size="36" font-weight="bold" fill="#fff" text-anchor="middle">CEMENT</text>
  <text x="256" y="280" font-family="Arial, sans-serif" font-size="20" fill="#fde68a" text-anchor="middle">OPC 53 GRADE</text>
  <text x="256" y="305" font-family="Arial, sans-serif" font-size="16" fill="#fff" text-anchor="middle">50 KG NET</text>
  <!-- Bottom info -->
  <text x="256" y="385" font-family="Arial, sans-serif" font-size="14" fill="#fff" text-anchor="middle" opacity="0.7">PORTLAND CEMENT</text>
  <!-- Side seams -->
  <line x1="118" y1="140" x2="120" y2="430" stroke="#1f2937" stroke-width="2"/>
  <line x1="394" y1="140" x2="392" y2="430" stroke="#1f2937" stroke-width="2"/>
  <!-- Subtle dust particles -->
  <circle cx="80" cy="430" r="3" fill="#9ca3af" opacity="0.6"/>
  <circle cx="430" cy="425" r="2" fill="#9ca3af" opacity="0.5"/>
  <circle cx="60" cy="445" r="2" fill="#9ca3af" opacity="0.4"/>
</svg>
